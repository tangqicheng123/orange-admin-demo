<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6a00" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffb066" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- app background -->
  <rect width="1200" height="750" fill="#f4f6fa"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="224" height="750" fill="#202634"/>
  <circle cx="40" cy="46" r="15" fill="url(#brand)"/>
  <rect x="62" y="38" width="120" height="16" rx="8" fill="#ffffff"/>
  <text x="62" y="58" fill="#cfe" font-size="13" opacity="0.0">.</text>

  <!-- nav -->
  <g>
    <!-- active -->
    <rect x="14" y="92" width="196" height="40" rx="10" fill="#ff6a00" opacity="0.18"/>
    <circle cx="38" cy="112" r="5" fill="#ff8b33"/>
    <rect x="56" y="104" width="90" height="12" rx="6" fill="#ffffff"/>
    <!-- others -->
    <circle cx="38" cy="156" r="5" fill="#5b6577"/>
    <rect x="56" y="148" width="74" height="12" rx="6" fill="#7b8699"/>
    <circle cx="38" cy="200" r="5" fill="#5b6577"/>
    <rect x="56" y="192" width="86" height="12" rx="6" fill="#7b8699"/>
    <circle cx="38" cy="244" r="5" fill="#5b6577"/>
    <rect x="56" y="236" width="68" height="12" rx="6" fill="#7b8699"/>
    <circle cx="38" cy="288" r="5" fill="#5b6577"/>
    <rect x="56" y="280" width="80" height="12" rx="6" fill="#7b8699"/>
    <circle cx="38" cy="332" r="5" fill="#5b6577"/>
    <rect x="56" y="324" width="72" height="12" rx="6" fill="#7b8699"/>
  </g>

  <!-- topbar -->
  <rect x="224" y="0" width="976" height="68" fill="#ffffff"/>
  <rect x="248" y="22" width="280" height="24" rx="12" fill="#eef1f6"/>
  <circle cx="1098" cy="34" r="16" fill="url(#brand)"/>
  <circle cx="1050" cy="34" r="13" fill="#e6e9ef"/>
  <circle cx="1050" cy="34" r="5" fill="#ff6a00"/>

  <!-- page title -->
  <rect x="248" y="96" width="160" height="20" rx="6" fill="#2b3445"/>
  <rect x="248" y="124" width="320" height="12" rx="6" fill="#aab2c0"/>

  <!-- stat cards -->
  <g>
    <rect x="248" y="168" width="216" height="112" rx="14" fill="#ffffff"/>
    <rect x="268" y="188" width="80" height="12" rx="6" fill="#aab2c0"/>
    <text x="268" y="248" fill="#ff6a00" font-size="30" font-weight="700">12,840</text>
    <rect x="492" y="168" width="216" height="112" rx="14" fill="#ffffff"/>
    <rect x="512" y="188" width="80" height="12" rx="6" fill="#aab2c0"/>
    <text x="512" y="248" fill="#2b3445" font-size="30" font-weight="700">¥ 38.6k</text>
    <rect x="736" y="168" width="216" height="112" rx="14" fill="#ffffff"/>
    <rect x="756" y="188" width="80" height="12" rx="6" fill="#aab2c0"/>
    <text x="756" y="248" fill="#2b3445" font-size="30" font-weight="700">1,204</text>
    <rect x="980" y="168" width="200" height="112" rx="14" fill="#ffffff"/>
    <rect x="1000" y="188" width="80" height="12" rx="6" fill="#aab2c0"/>
    <text x="1000" y="248" fill="#2b3445" font-size="30" font-weight="700">98.7%</text>
  </g>

  <!-- chart card -->
  <rect x="248" y="304" width="704" height="356" rx="14" fill="#ffffff"/>
  <rect x="272" y="328" width="120" height="14" rx="7" fill="#2b3445"/>
  <!-- bars -->
  <g>
    <rect x="300" y="470" width="44" height="120" rx="6" fill="url(#bar)"/>
    <rect x="372" y="430" width="44" height="160" rx="6" fill="url(#bar)"/>
    <rect x="444" y="400" width="44" height="190" rx="6" fill="url(#bar)"/>
    <rect x="516" y="360" width="44" height="230" rx="6" fill="url(#bar)"/>
    <rect x="588" y="420" width="44" height="170" rx="6" fill="url(#bar)"/>
    <rect x="660" y="350" width="44" height="240" rx="6" fill="url(#bar)"/>
    <rect x="732" y="410" width="44" height="180" rx="6" fill="url(#bar)"/>
    <rect x="804" y="380" width="44" height="210" rx="6" fill="url(#bar)"/>
    <rect x="876" y="440" width="44" height="150" rx="6" fill="url(#bar)"/>
  </g>
  <line x1="290" y1="600" x2="936" y2="600" stroke="#eef1f6" stroke-width="2"/>

  <!-- table / list card -->
  <rect x="980" y="304" width="200" height="356" rx="14" fill="#ffffff"/>
  <rect x="1004" y="328" width="100" height="14" rx="7" fill="#2b3445"/>
  <g fill="#eef1f6">
    <rect x="1004" y="368" width="152" height="34" rx="8"/>
    <rect x="1004" y="414" width="152" height="34" rx="8"/>
    <rect x="1004" y="460" width="152" height="34" rx="8"/>
    <rect x="1004" y="506" width="152" height="34" rx="8"/>
    <rect x="1004" y="552" width="152" height="34" rx="8"/>
  </g>
  <g fill="#ff6a00">
    <circle cx="1020" cy="385" r="6"/><circle cx="1020" cy="431" r="6"/>
    <circle cx="1020" cy="477" r="6"/><circle cx="1020" cy="523" r="6"/>
    <circle cx="1020" cy="569" r="6"/>
  </g>

  <text x="248" y="700" fill="#9aa3b2" font-size="13">界面预览 · 示意图（OrangeAdmin 橙枢）</text>
</svg>
